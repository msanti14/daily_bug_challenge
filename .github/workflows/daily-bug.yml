name: Daily Bug Challenge

on:
  schedule:
    - cron: '0 9 * * *'   # 6am Argentina (UTC-3) = 9am UTC
  workflow_dispatch:        # permite correrlo manualmente para probar

permissions:
  issues: write
  contents: read

jobs:
  generate-bug:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate bug, create issue & send email
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        run: python scripts/generate_bug.py
